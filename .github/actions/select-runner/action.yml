name: Select runner
description: Route jobs to self-hosted runners when the PR has a runner-* label matching a worker label
outputs:
  runner:
    description: Worker label from the PR (e.g. runner-betree), or empty to use the job default
    value: ${{ steps.select.outputs.runner }}
  runs-on-spec:
    description: JSON runs-on object/array for self-hosted routing, or empty
    value: ${{ steps.select.outputs.runs-on-spec }}
runs:
  using: composite
  steps:
    - id: select
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUNNER_GROUP: ${{ env.RUNNER_GROUP }}
      run: |
        runner=""
        runs_on_spec=""
        pr_number=""

        if [ "${{ github.event_name }}" = "pull_request" ]; then
          pr_number="${{ github.event.pull_request.number }}"
        elif [ "${{ github.event_name }}" = "push" ]; then
          # Workflows like E2E only trigger on push; resolve labels from the open PR on this branch.
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${{ github.ref_name }}" --state open \
            --json number --jq '.[0].number // empty')
        fi

        if [ -n "$pr_number" ]; then
          # Event payload labels are frozen at trigger time; re-runs and label-only
          # updates do not refresh them. Fetch current labels from the API instead.
          # PR label runner-betree matches a worker with the same runner-betree label.
          runner=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" \
            --jq '[.[] | select(.name | startswith("runner-")) | .name] | first // empty')
        fi

        if [ -n "$runner" ]; then
          if [ -n "${RUNNER_GROUP:-}" ]; then
            runs_on_spec=$(jq -cn --arg g "$RUNNER_GROUP" --arg l "$runner" '{group: $g, labels: $l}')
          else
            runs_on_spec=$(jq -cn --arg l "$runner" '["self-hosted", $l]')
          fi
        fi

        echo "runner=${runner}" >> "$GITHUB_OUTPUT"
        echo "runs-on-spec=${runs_on_spec}" >> "$GITHUB_OUTPUT"
