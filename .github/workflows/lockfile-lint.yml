name: Lockfile lint

on:
  pull_request:
    paths:
      - 'package-lock.json'
    types:
      - opened
      - synchronize
      - reopened

jobs:
  select-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        uses: ./.github/actions/select-runner

  lockfile-lint:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate package-lock.json
        run: npx --yes lockfile-lint@5 --path package-lock.json --type npm --validate-https --allowed-hosts registry.npmjs.org
