name: Lockfile lint

on:
  pull_request:
    paths:
      - 'package-lock.json'
    types:
      - opened
      - synchronize
      - reopened

jobs:
  select-runner:
    uses: ./.github/workflows/select-runner.yml
    permissions:
      pull-requests: read

  lockfile-lint:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate package-lock.json
        run: npx --yes lockfile-lint@5 --path package-lock.json --type npm --validate-https --allowed-hosts registry.npmjs.org
