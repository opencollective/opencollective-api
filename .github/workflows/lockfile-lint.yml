name: Lockfile lint

on:
  pull_request:
    paths:
      - 'package-lock.json'
    types:
      - opened
      - synchronize
      - reopened

env:
  SELF_HOSTED_RUNNER_GROUP: ${{ vars.SELF_HOSTED_RUNNER_GROUP || 'Default' }}

jobs:
  select-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      pull-requests: read
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      runs-on-spec: ${{ steps.select.outputs.runs-on-spec }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        uses: ./.github/actions/select-runner
        env:
          RUNNER_GROUP: ${{ env.SELF_HOSTED_RUNNER_GROUP }}

  lockfile-lint:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.runs-on-spec != '' && fromJSON(needs.select-runner.outputs.runs-on-spec) || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate package-lock.json
        run: npx --yes lockfile-lint@5 --path package-lock.json --type npm --validate-https --allowed-hosts registry.npmjs.org
