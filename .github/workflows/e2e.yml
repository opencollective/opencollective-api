name: E2E

# Security: Do not switch this workflow to `pull_request_target` to run on fork PRs with secrets.
# Use `pull_request` (secrets blocked for forks by default) or trusted push/workflow_dispatch instead.
#
# Branch protection: required checks are `e2e (0*.(js|ts))` … `e2e (4*.(js|ts))`; `playwright` (below) is
# meant to join them.

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TZ: UTC
  OC_ENV: ci
  NODE_ENV: test
  WEBSITE_URL: http://localhost:3000
  IMAGES_URL: http://localhost:3001
  API_URL: http://localhost:3060
  PDF_SERVICE_URL: http://localhost:3002
  API_KEY: dvl-1510egmf4a23d80342403fb599qd
  CI: true

  AWS_KEY: user
  AWS_SECRET: password
  AWS_S3_BUCKET: opencollective-e2e
  AWS_S3_REGION: us-east-1
  AWS_S3_API_VERSION: latest
  AWS_S3_ENDPOINT: http://localhost:9000
  AWS_S3_SSL_ENABLED: false
  AWS_S3_FORCE_PATH_STYLE: true
  GRAPHQL_ERROR_DETAILED: true
  DISABLE_MOCK_UPLOADS: 1
  E2E_TEST: 1
  PGHOST: localhost
  PGUSER: opencollective
  CYPRESS_COVERAGE: false
  CYPRESS_RECORD: false
  CYPRESS_VIDEO: false
  CYPRESS_VIDEO_UPLOAD_ON_PASSES: false
  CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
  GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
  GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
  API_FOLDER: /home/runner/work/opencollective-api/opencollective-api
  FRONTEND_FOLDER: /home/runner/work/opencollective-api/opencollective-api/opencollective-frontend
  IMAGES_FOLDER: /home/runner/work/opencollective-api/opencollective-api/opencollective-images
  PDF_FOLDER: /home/runner/work/opencollective-api/opencollective-api/opencollective-pdf
  TERM: xterm
  STRIPE_WEBHOOK_KEY: ${{ secrets.STRIPE_WEBHOOK_KEY }}
  STRIPE_WEBHOOK_SIGNING_SECRET: ${{ secrets.STRIPE_WEBHOOK_SIGNING_SECRET }}

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    outputs:
      frontend-ref: ${{ steps.checkout-stack.outputs.frontend-ref }}
      images-ref: ${{ steps.checkout-stack.outputs.images-ref }}
      pdf-ref: ${{ steps.checkout-stack.outputs.pdf-ref }}

    steps:
      - name: Checkout (api)
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Get Node major version
        id: node-major
        run: echo "version=$(node -p 'process.versions.node.split(`.`)[0]')" >> "$GITHUB_OUTPUT"

      - name: Checkout E2E stack
        id: checkout-stack
        uses: ./.github/actions/checkout-e2e-stack
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore node_modules (frontend)
        uses: actions/cache@v6
        id: frontend-node-modules
        with:
          path: opencollective-frontend/node_modules
          key: ${{ runner.os }}-node${{ steps.node-major.outputs.version }}-frontend-node-modules-${{ hashFiles('opencollective-frontend/package-lock.json') }}

      - name: Install dependencies (frontend)
        if: steps.frontend-node-modules.outputs.cache-hit != 'true'
        working-directory: opencollective-frontend
        env:
          npm_config_engine_strict: 'false'
        run: CYPRESS_INSTALL_BINARY=0 npm ci --prefer-offline --no-audit --no-fund

      - name: Restore node_modules (images)
        uses: actions/cache@v6
        id: images-node-modules
        with:
          path: opencollective-images/node_modules
          key: ${{ runner.os }}-node${{ steps.node-major.outputs.version }}-images-node-modules-${{ hashFiles('opencollective-images/package-lock.json') }}

      - name: Install dependencies (images)
        working-directory: opencollective-images
        if: steps.images-node-modules.outputs.cache-hit != 'true'
        env:
          npm_config_engine_strict: 'false'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore node_modules (pdf)
        uses: actions/cache@v6
        id: pdf-node-modules
        with:
          path: opencollective-pdf/node_modules
          key: ${{ runner.os }}-node${{ steps.node-major.outputs.version }}-pdf-node-modules-${{ hashFiles('opencollective-pdf/package-lock.json') }}

      - name: Install dependencies (pdf)
        working-directory: opencollective-pdf
        if: steps.pdf-node-modules.outputs.cache-hit != 'true'
        env:
          npm_config_engine_strict: 'false'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore NextJS build cache
        uses: actions/cache@v6
        with:
          path: opencollective-frontend/.next/cache
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-nextjs-${{ hashFiles('opencollective-frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-nextjs-${{ hashFiles('opencollective-frontend/package-lock.json') }}-

      - name: Build API, frontend, images, and PDF
        run: |
          set -eu
          fail=0
          npm run build:e2e &
          api_pid=$!
          (cd opencollective-frontend && PRESERVE_NEXT_CACHE=true npm run build) &
          frontend_pid=$!
          (cd opencollective-images && npm run build) &
          images_pid=$!
          (cd opencollective-pdf && npm run build) &
          pdf_pid=$!
          wait "$api_pid" || { echo "API build failed"; fail=1; }
          wait "$frontend_pid" || { echo "Frontend build failed"; fail=1; }
          wait "$images_pid" || { echo "Images build failed"; fail=1; }
          wait "$pdf_pid" || { echo "PDF build failed"; fail=1; }
          exit "$fail"

      - name: Stage Next.js build
        run: |
          set -euo pipefail
          mkdir -p /tmp/frontend-next
          rsync -a --exclude cache/ opencollective-frontend/.next/ /tmp/frontend-next/
          test -f /tmp/frontend-next/BUILD_ID
          test -f /tmp/frontend-next/routes-manifest.json
          # The frontend build also writes outside .next/: its next.config.js copies the pdf.js worker and cMaps
          # into public/static/ (gitignored). The e2e jobs start from a fresh checkout and get only what this
          # artifact carries, so these generated files must travel with .next/ (restored below), or the e2e
          # frontend answers 404 for the worker and PDF previews never render. Same as the frontend's ci.yml.
          mkdir -p /tmp/frontend-next/_generated-public/static/scripts
          cp opencollective-frontend/public/static/scripts/pdf.worker.min.mjs /tmp/frontend-next/_generated-public/static/scripts/
          rsync -a opencollective-frontend/public/static/cmaps /tmp/frontend-next/_generated-public/static/

      # Artifact service calls sometimes fail on network errors (e.g. `Failed to CreateArtifact: Unable to make
      # request: ECONNRESET`) that the action itself does not retry. Retry once so a transient blip doesn't fail the run.
      - name: Upload Next.js build
        id: upload-next
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: frontend-next
          path: /tmp/frontend-next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload Next.js build (retry)
        if: steps.upload-next.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-next
          path: /tmp/frontend-next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Stage service dist artifacts
        run: |
          set -euo pipefail
          stage=/tmp/e2e-service-dists
          mkdir -p "$stage/opencollective-api" "$stage/opencollective-images" "$stage/opencollective-pdf"
          cp -a dist "$stage/opencollective-api/dist"
          cp -a opencollective-images/dist "$stage/opencollective-images/dist"
          cp -a opencollective-pdf/dist "$stage/opencollective-pdf/dist"
          test -f "$stage/opencollective-api/dist/e2e/index.js"
          test -e "$stage/opencollective-images/dist/server"
          test -f "$stage/opencollective-pdf/dist/server/index.js"

      # Artifact service calls sometimes fail on network errors (e.g. `Failed to CreateArtifact: Unable to make
      # request: ECONNRESET`) that the action itself does not retry. Retry once so a transient blip doesn't fail the run.
      - name: Upload service dist artifacts
        id: upload-service-dists
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-service-dists
          path: /tmp/e2e-service-dists
          if-no-files-found: error
          retention-days: 1

      - name: Upload service dist artifacts (retry)
        if: steps.upload-service-dists.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-service-dists
          path: /tmp/e2e-service-dists
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Set the repository variable `DISABLE_CYPRESS` to `true` (Settings > Secrets and variables > Actions >
  # Variables) to skip the Cypress shards while the specs stay in the frontend. Remove the shard checks from the
  # required checks first: a skipped matrix reports one unexpanded check, so the per-shard required checks would
  # wait forever. The `playwright` job below is unaffected.
  e2e:
    name: e2e (${{ matrix.files }})
    if: ${{ vars.DISABLE_CYPRESS != 'true' }}
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        files: ['0*.(js|ts)', '1*.(js|ts)', '2*.(js|ts)', '3*.(js|ts)', '4*.(js|ts)']

    services:
      redis:
        image: valkey/valkey:9.1
        ports:
          - 6379:6379
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 5
      rustfs:
        image: rustfs/rustfs:1.0.0-rc.6@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
        ports:
          - 9000:9000
        options: --name=rustfs --health-cmd "curl -f http://localhost:9000/health/ready"
        env:
          RUSTFS_ACCESS_KEY: user
          RUSTFS_SECRET_KEY: password

    steps:
      # man-db trigger on apt install is taking some time
      - name: Disable man-db update
        run: sudo rm -f /var/lib/man-db/auto-update
      - name: Update apt
        run: sudo apt-get update || exit 0

      - name: Install dependencies
        run: |
          sudo apt-get install \
          `# Cypress dependencies - see https://docs.cypress.io/app/get-started/install-cypress#UbuntuDebian` \
          libgtk2.0-0t64 libgtk-3-0t64 libgbm-dev libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Setup S3 bucket
        env:
          AWS_ACCESS_KEY_ID: user
          AWS_SECRET_ACCESS_KEY: password
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url http://127.0.0.1:9000 s3api head-bucket --bucket opencollective-e2e 2>/dev/null ||
            aws --endpoint-url http://127.0.0.1:9000 s3api create-bucket --bucket opencollective-e2e

      - name: Checkout (api)
        uses: actions/checkout@v7

      - name: Restore stripe-cli
        uses: actions/cache@v6
        id: stripe-cli
        with:
          path: ${{ github.workspace }}/.stripe-cli
          key: ${{ runner.os }}-stripe-cli-1.13.9-linux-x86_64

      - name: Install stripe-cli
        if: steps.stripe-cli.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.stripe-cli"
          curl -fsSL -o /tmp/stripe.tgz https://github.com/stripe/stripe-cli/releases/download/v1.13.9/stripe_1.13.9_linux_x86_64.tar.gz
          tar -xzf /tmp/stripe.tgz -C /tmp
          mv /tmp/stripe "${GITHUB_WORKSPACE}/.stripe-cli/stripe"
          chmod +x "${GITHUB_WORKSPACE}/.stripe-cli/stripe"

      - name: Add stripe-cli to PATH
        run: |
          chmod +x "${GITHUB_WORKSPACE}/.stripe-cli/stripe"
          echo "${GITHUB_WORKSPACE}/.stripe-cli" >> "${GITHUB_PATH}"

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Get Node major version
        id: node-major
        run: echo "version=$(node -p 'process.versions.node.split(`.`)[0]')" >> "$GITHUB_OUTPUT"

      - name: Checkout E2E stack
        uses: ./.github/actions/checkout-e2e-stack
        with:
          frontend-ref: ${{ needs.prepare.outputs.frontend-ref }}
          images-ref: ${{ needs.prepare.outputs.images-ref }}
          pdf-ref: ${{ needs.prepare.outputs.pdf-ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore node_modules (frontend)
        uses: actions/cache@v6
        id: frontend-node-modules
        with:
          path: opencollective-frontend/node_modules
          key: ${{ runner.os }}-node${{ steps.node-major.outputs.version }}-frontend-node-modules-${{ hashFiles('opencollective-frontend/package-lock.json') }}

      - name: Install dependencies (frontend)
        if: steps.frontend-node-modules.outputs.cache-hit != 'true'
        working-directory: opencollective-frontend
        env:
          npm_config_engine_strict: 'false'
        run: CYPRESS_INSTALL_BINARY=0 npm ci --prefer-offline --no-audit --no-fund

      - name: Restore node_modules (images)
        uses: actions/cache@v6
        id: images-node-modules
        with:
          path: opencollective-images/node_modules
          key: ${{ runner.os }}-node${{ steps.node-major.outputs.version }}-images-node-modules-${{ hashFiles('opencollective-images/package-lock.json') }}

      - name: Install dependencies (images)
        working-directory: opencollective-images
        if: steps.images-node-modules.outputs.cache-hit != 'true'
        env:
          npm_config_engine_strict: 'false'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore node_modules (pdf)
        uses: actions/cache@v6
        id: pdf-node-modules
        with:
          path: opencollective-pdf/node_modules
          key: ${{ runner.os }}-node${{ steps.node-major.outputs.version }}-pdf-node-modules-${{ hashFiles('opencollective-pdf/package-lock.json') }}

      - name: Install dependencies (pdf)
        working-directory: opencollective-pdf
        if: steps.pdf-node-modules.outputs.cache-hit != 'true'
        env:
          npm_config_engine_strict: 'false'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore Cypress
        uses: actions/cache@v6
        id: cypress
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('opencollective-frontend/node_modules/cypress/package.json') }}

      - name: Install Cypress
        if: steps.cypress.outputs.cache-hit != 'true'
        working-directory: opencollective-frontend
        run: npx cypress install

      # Retry downloads once on transient artifact service errors (see "Upload Next.js build")
      - name: Download Next.js build
        id: download-next
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: frontend-next
          path: /tmp/frontend-next

      - name: Download Next.js build (retry)
        if: steps.download-next.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: frontend-next
          path: /tmp/frontend-next

      - name: Download service dist artifacts
        id: download-service-dists
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: e2e-service-dists
          path: /tmp/e2e-service-dists

      - name: Download service dist artifacts (retry)
        if: steps.download-service-dists.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: e2e-service-dists
          path: /tmp/e2e-service-dists

      - name: Restore downloaded builds
        run: |
          set -euo pipefail

          next_root=/tmp/frontend-next
          if [ ! -f "${next_root}/BUILD_ID" ] && [ -f "${next_root}/frontend-next/BUILD_ID" ]; then
            next_root="${next_root}/frontend-next"
          fi
          mkdir -p opencollective-frontend/.next
          rsync -a --exclude _generated-public/ "${next_root}/" opencollective-frontend/.next/
          test -f opencollective-frontend/.next/BUILD_ID
          test -f opencollective-frontend/.next/routes-manifest.json
          # Put back the files the frontend build generated in public/ (see "Stage Next.js build")
          rsync -a "${next_root}/_generated-public/" opencollective-frontend/public/
          test -f opencollective-frontend/public/static/scripts/pdf.worker.min.mjs

          stack_root=/tmp/e2e-service-dists
          if [ ! -d "${stack_root}/opencollective-api/dist" ] && [ -d "${stack_root}/e2e-service-dists/opencollective-api/dist" ]; then
            stack_root="${stack_root}/e2e-service-dists"
          fi
          rm -rf dist opencollective-images/dist opencollective-pdf/dist
          cp -a "${stack_root}/opencollective-api/dist" dist
          cp -a "${stack_root}/opencollective-images/dist" opencollective-images/dist
          cp -a "${stack_root}/opencollective-pdf/dist" opencollective-pdf/dist
          test -f dist/e2e/index.js
          test -e opencollective-images/dist/server
          test -f opencollective-pdf/dist/server/index.js

      - name: Setup DB
        working-directory: opencollective-frontend
        run: ./scripts/setup_db.sh

      - name: Run E2E with Cypress
        working-directory: opencollective-frontend
        run: ./scripts/run_e2e_tests.sh
        env:
          CYPRESS_TEST_FILES: ${{ matrix.files }}

      - name: Archive test screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.run_id }}-${{ strategy.job-index }}
          path: opencollective-frontend/test/cypress/screenshots
        if: ${{ failure() }}

  # Playwright: every spec under the frontend's test/playwright/specs, run through its shared launcher
  # (test/playwright/run-local.sh) on one stack, like the frontend's `e2e-playwright / playwright` job. It runs
  # against this API revision and the frontend branch resolved by `prepare` (same-named branch, else main), so
  # an API-only change gets the Playwright coverage too. The check is `playwright`; its name does not depend
  # on the selection or the worker count, so it can be required (opencollective/opencollective#8970).
  # Live Stripe: journeys tagged @stripe forward the test account's webhooks with STRIPE_WEBHOOK_KEY, as the
  # Cypress jobs do. Forks get no secrets and run with --without-stripe, which excludes them and reports
  # Stripe coverage unavailable; trusted runs never exclude them, so broken credentials fail the job.
  playwright:
    name: playwright
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    env:
      # The launcher restores its own disposable database as the service's superuser.
      PGUSER: postgres
      MAILPIT_URL: http://localhost:8025
      # Supplied Valkey shared by the browser workers; the launcher validates it and never stops it.
      REDIS_URL: redis://localhost:6379
      # Same budget as the frontend job: 2 workers were measured on this 4-vCPU runner
      # (opencollective/opencollective#8969). Routine CI permits at most one retry.
      PLAYWRIGHT_WORKERS: '2'
      PLAYWRIGHT_RETRIES: '1'
      # Every spec (the launcher's own default is the smoke spec alone), relative to the frontend checkout.
      PLAYWRIGHT_SPEC: test/playwright/specs

    services:
      redis:
        image: valkey/valkey:9.1
        ports:
          - 6379:6379
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 5
      rustfs:
        image: rustfs/rustfs:1.0.0-rc.6@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
        ports:
          - 9000:9000
        options: --name=rustfs --health-cmd "curl -f http://localhost:9000/health/ready"
        env:
          RUSTFS_ACCESS_KEY: user
          RUSTFS_SECRET_KEY: password
      mailpit:
        # No container healthcheck (the image has no curl/wget): the launcher waits for Mailpit itself.
        image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
        ports:
          - 8025:8025
          - 1025:1025

    steps:
      # man-db trigger on apt install is taking some time
      - name: Disable man-db update
        run: sudo rm -f /var/lib/man-db/auto-update
      - name: Update apt
        run: sudo apt-get update || exit 0

      - name: Install dependencies
        run: |
          sudo apt-get install \
          `# Postgres client (psql/pg_isready for the launcher; the restore runs from the postgres:16 image, see USE_DOCKER)` \
          postgresql-client \
          `# Redis client: the launcher validates the supplied Redis service` \
          redis-tools

      - name: Setup S3 bucket
        env:
          AWS_ACCESS_KEY_ID: user
          AWS_SECRET_ACCESS_KEY: password
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url http://127.0.0.1:9000 s3api head-bucket --bucket opencollective-e2e 2>/dev/null ||
            aws --endpoint-url http://127.0.0.1:9000 s3api create-bucket --bucket opencollective-e2e
          # Like the production bucket, let the website read stored files from the browser (the PDF viewer
          # fetches attachments).
          aws --endpoint-url http://127.0.0.1:9000 s3api put-bucket-cors --bucket opencollective-e2e \
            --cors-configuration '{"CORSRules":[{"AllowedOrigins":["http://localhost:3000"],"AllowedMethods":["GET","HEAD"],"AllowedHeaders":["*"],"MaxAgeSeconds":3600}]}'

      - name: Checkout (api)
        uses: actions/checkout@v7

      - name: Restore stripe-cli
        uses: actions/cache@v6
        id: stripe-cli
        with:
          path: ${{ github.workspace }}/.stripe-cli
          key: ${{ runner.os }}-stripe-cli-1.13.9-linux-x86_64

      - name: Install stripe-cli
        if: steps.stripe-cli.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.stripe-cli"
          curl -fsSL -o /tmp/stripe.tgz https://github.com/stripe/stripe-cli/releases/download/v1.13.9/stripe_1.13.9_linux_x86_64.tar.gz
          tar -xzf /tmp/stripe.tgz -C /tmp
          mv /tmp/stripe "${GITHUB_WORKSPACE}/.stripe-cli/stripe"
          chmod +x "${GITHUB_WORKSPACE}/.stripe-cli/stripe"

      - name: Add stripe-cli to PATH
        run: |
          chmod +x "${GITHUB_WORKSPACE}/.stripe-cli/stripe"
          echo "${GITHUB_WORKSPACE}/.stripe-cli" >> "${GITHUB_PATH}"

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Get Node major version
        id: node-major
        run: echo "version=$(node -p 'process.versions.node.split(`.`)[0]')" >> "$GITHUB_OUTPUT"

      - name: Checkout E2E stack
        uses: ./.github/actions/checkout-e2e-stack
        with:
          frontend-ref: ${{ needs.prepare.outputs.frontend-ref }}
          images-ref: ${{ needs.prepare.outputs.images-ref }}
          pdf-ref: ${{ needs.prepare.outputs.pdf-ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore node_modules (frontend)
        uses: actions/cache@v6
        id: frontend-node-modules
        with:
          path: opencollective-frontend/node_modules
          key: ${{ runner.os }}-node${{ steps.node-major.outputs.version }}-frontend-node-modules-${{ hashFiles('opencollective-frontend/package-lock.json') }}

      - name: Install dependencies (frontend)
        if: steps.frontend-node-modules.outputs.cache-hit != 'true'
        working-directory: opencollective-frontend
        env:
          npm_config_engine_strict: 'false'
        run: CYPRESS_INSTALL_BINARY=0 npm ci --prefer-offline --no-audit --no-fund

      - name: Restore node_modules (images)
        uses: actions/cache@v6
        id: images-node-modules
        with:
          path: opencollective-images/node_modules
          key: ${{ runner.os }}-node${{ steps.node-major.outputs.version }}-images-node-modules-${{ hashFiles('opencollective-images/package-lock.json') }}

      - name: Install dependencies (images)
        working-directory: opencollective-images
        if: steps.images-node-modules.outputs.cache-hit != 'true'
        env:
          npm_config_engine_strict: 'false'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore node_modules (pdf)
        uses: actions/cache@v6
        id: pdf-node-modules
        with:
          path: opencollective-pdf/node_modules
          key: ${{ runner.os }}-node${{ steps.node-major.outputs.version }}-pdf-node-modules-${{ hashFiles('opencollective-pdf/package-lock.json') }}

      - name: Install dependencies (pdf)
        working-directory: opencollective-pdf
        if: steps.pdf-node-modules.outputs.cache-hit != 'true'
        env:
          npm_config_engine_strict: 'false'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore Playwright browser
        uses: actions/cache@v6
        id: playwright-browser
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('opencollective-frontend/package-lock.json') }}

      - name: Install Playwright system dependencies
        # Always installed (not cached): fresh runners have no OS packages.
        working-directory: opencollective-frontend
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-browser.outputs.cache-hit != 'true'
        working-directory: opencollective-frontend
        run: npx playwright install chromium

      # Retry downloads once on transient artifact service errors (see "Upload Next.js build")
      - name: Download Next.js build
        id: download-next
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: frontend-next
          path: /tmp/frontend-next

      - name: Download Next.js build (retry)
        if: steps.download-next.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: frontend-next
          path: /tmp/frontend-next

      - name: Download service dist artifacts
        id: download-service-dists
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: e2e-service-dists
          path: /tmp/e2e-service-dists

      - name: Download service dist artifacts (retry)
        if: steps.download-service-dists.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: e2e-service-dists
          path: /tmp/e2e-service-dists

      - name: Restore downloaded builds
        run: |
          set -euo pipefail

          next_root=/tmp/frontend-next
          if [ ! -f "${next_root}/BUILD_ID" ] && [ -f "${next_root}/frontend-next/BUILD_ID" ]; then
            next_root="${next_root}/frontend-next"
          fi
          mkdir -p opencollective-frontend/.next
          rsync -a --exclude _generated-public/ "${next_root}/" opencollective-frontend/.next/
          test -f opencollective-frontend/.next/BUILD_ID
          test -f opencollective-frontend/.next/routes-manifest.json
          # Put back the files the frontend build generated in public/ (see "Stage Next.js build")
          rsync -a "${next_root}/_generated-public/" opencollective-frontend/public/
          test -f opencollective-frontend/public/static/scripts/pdf.worker.min.mjs

          stack_root=/tmp/e2e-service-dists
          if [ ! -d "${stack_root}/opencollective-api/dist" ] && [ -d "${stack_root}/e2e-service-dists/opencollective-api/dist" ]; then
            stack_root="${stack_root}/e2e-service-dists"
          fi
          rm -rf dist opencollective-images/dist opencollective-pdf/dist
          cp -a "${stack_root}/opencollective-api/dist" dist
          cp -a "${stack_root}/opencollective-images/dist" opencollective-images/dist
          cp -a "${stack_root}/opencollective-pdf/dist" opencollective-pdf/dist
          test -f dist/e2e/index.js
          test -e opencollective-images/dist/server
          test -f opencollective-pdf/dist/server/index.js

      - name: Report trusted/fork mode
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "Fork PR: credential-free run without secrets. Tests tagged @stripe are excluded and reported"
            echo "unavailable (--without-stripe)."
            echo "PLAYWRIGHT_WITHOUT_STRIPE=1" >> "$GITHUB_ENV"
          else
            echo "Trusted run: every journey, including live Stripe (@stripe). Missing or broken Stripe credentials fail the run."
          fi

      # Seeds the database, starts the services, checks readiness and runs every spec: the same contract as
      # local runs and the frontend job.
      - name: Run Playwright specs via shared launcher
        working-directory: opencollective-frontend
        run: ./test/playwright/run-local.sh
        env:
          # Run pg_restore & co from the postgres:16 image, matching the PostgreSQL 16 service whatever client the runner ships
          USE_DOCKER: true

      - name: Report Playwright attempt outcome
        if: ${{ always() }}
        working-directory: opencollective-frontend
        run: |
          manifest="$(ls -t test/playwright/.artifacts/*/replay-manifest.json 2>/dev/null | head -n 1 || true)"
          if [ -z "$manifest" ]; then
            echo "No replay manifest: the launcher never reached run identity (infrastructure failure before evidence)."
            exit 0
          fi
          echo "Manifest: $manifest"
          jq -r '"mode=\(.mode) status=\(.status) playwrightExitCode=\(.playwrightExitCode) runId=\(.runId)"' "$manifest"
          jq -r '"stripe: mode=\(.stripe.mode // "unknown") selected=\(.stripe.selected // 0) probe=\(.stripe.probe // null | tojson) gateVerdicts=\(.stripe.gateVerdicts // null | tojson)"' "$manifest"
          results="$(ls -t test/playwright/.artifacts/*/report/results.json 2>/dev/null | head -n 1 || true)"
          if [ -z "$results" ]; then
            echo "No Playwright results.json: browser execution never started (setup failure or interruption; see manifest status)."
            exit 0
          fi
          jq -r '"first-attempt: expected=\(.stats.expected) unexpected=\(.stats.unexpected) flaky=\(.stats.flaky) skipped=\(.stats.skipped)"' "$results"
          jq -r '[.. | objects | select(has("tests") and has("tags")) | select(any(.tags[]; . == "stripe")) | .tests[] | (.results[-1].status // "not-run")] | group_by(.) | map("\(.[0])=\(length)") | "stripe journeys: " + (if length == 0 then "none ran" else join(" ") end)' "$results"
          echo "Reading: unexpected=final failures, flaky=recovered on retry (original attempt kept in test-results/), expected=passed first attempt."

      - name: Upload Playwright evidence (failure/recovery, 14 days)
        uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled() }}
        with:
          name: playwright-evidence-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: opencollective-frontend/test/playwright/.artifacts
          # `.artifacts` is dot-prefixed: without this, upload-artifact skips the run directory.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright evidence (success, 7 days)
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: playwright-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: opencollective-frontend/test/playwright/.artifacts
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
