name: Update address metadata

# Monthly refresh of `server/lib/address/countries.json` from Google's address metadata service.
# Opens (or updates) a pull request when the data changed; does nothing otherwise.

on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of every month
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.repository == 'opencollective/opencollective-api'
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Regenerate countries.json
        run: npm run script scripts/update-address-metadata.ts

      - name: Format
        run: npx prettier --write server/lib/address/countries.json

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: chore/update-address-metadata
          delete-branch: true
          add-paths: server/lib/address/countries.json
          commit-message: 'chore(address): update address metadata from Google'
          title: 'chore(address): update address metadata from Google'
          body: |
            Monthly refresh of `server/lib/address/countries.json` from [Google's address metadata service](https://chromium-i18n.appspot.com/ssl-address), generated by `scripts/update-address-metadata.ts`.

            This can change how addresses are formatted and which subdivision codes `normalizeZoneCode` accepts. Review the diff for removed or renamed region codes before merging.

            _Opened automatically by the `${{ github.workflow }}` workflow ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))._
