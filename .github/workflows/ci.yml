name: CI

# Security: Do not replace `pull_request` with `pull_request_target` to expose secrets or
# GITHUB_TOKEN write access to PR code. pull_request_target runs untrusted fork PR code with
# base-branch privileges.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TZ: UTC
  CI: true
  OC_ENV: ci
  NODE_ENV: test
  AWS_KEY: user
  AWS_SECRET: password
  AWS_S3_BUCKET: opencollective-e2e
  AWS_S3_REGION: us-east-1
  AWS_S3_API_VERSION: latest
  AWS_S3_ENDPOINT: http://localhost:9000
  AWS_S3_SSL_ENABLED: false
  AWS_S3_FORCE_PATH_STYLE: true

jobs:
  lint:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Restore ESLint cache
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-eslint-${{ hashFiles('eslint.config.mjs', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-eslint-${{ hashFiles('eslint.config.mjs', 'package-lock.json') }}-

      - run: npm run lint:check

  prettier:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Restore Prettier cache
        uses: actions/cache@v6
        with:
          path: .prettiercache
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-prettier-${{ hashFiles('.prettierrc', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-prettier-${{ hashFiles('.prettierrc', 'package-lock.json') }}-

      - run: npm run prettier:check

  typescript:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Restore TypeScript incremental cache
        uses: actions/cache@v6
        with:
          path: tsconfig.tsbuildinfo
          # Exact commit only: restoring tsbuildinfo from another SHA corrupts incremental state and can crash tsc (stack overflow on TS 6).
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-tsc-${{ hashFiles('tsconfig.json', 'package-lock.json') }}-${{ github.sha }}

      - run: npm run type:check

  depcheck:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - run: npm run depcheck

  ts-unused-exports:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Check unused exports
        run: npm run ts-unused-exports

  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Build
        run: npm run build

  test:
    runs-on: ${{ vars.CI_RUNNER_LARGE || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    env:
      PG_DATABASE: opencollective_test
    services:
      redis:
        image: valkey/valkey:9.1
        ports:
          - 6379:6379
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 5
      rustfs:
        image: rustfs/rustfs:1.0.0-rc.6@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
        ports:
          - 9000:9000
        options: --name=rustfs --health-cmd "curl -f http://localhost:9000/health/ready"
        env:
          RUSTFS_ACCESS_KEY: user
          RUSTFS_SECRET_KEY: password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      # The ubuntu-26.04 image ships PostgreSQL 18 client tools, whose pg_restore emits
      # `SET transaction_timeout` that the PostgreSQL 16 service rejects. Run them from the postgres:16 image.
      - run: npm run db:restore:test
        env:
          USE_DOCKER: true

      - name: Test
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: npm run test:ci -- --ignore "test/server/graphql/**"

      - name: Test with coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run test:coverage -- --ignore "test/server/graphql/**"

      - name: Report coverage
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: Unit

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: Unit
          files: test-results.xml
          report_type: test_results

  test-graphql:
    runs-on: ${{ vars.CI_RUNNER_LARGE || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30

    env:
      PG_DATABASE: opencollective_test

    services:
      redis:
        image: valkey/valkey:9.1
        ports:
          - 6379:6379
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 5
      rustfs:
        image: rustfs/rustfs:1.0.0-rc.6@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
        ports:
          - 9000:9000
        options: --name=rustfs --health-cmd "curl -f http://localhost:9000/health/ready"
        env:
          RUSTFS_ACCESS_KEY: user
          RUSTFS_SECRET_KEY: password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      # The ubuntu-26.04 image ships PostgreSQL 18 client tools, whose pg_restore emits
      # `SET transaction_timeout` that the PostgreSQL 16 service rejects. Run them from the postgres:16 image.
      - run: npm run db:restore:test
        env:
          USE_DOCKER: true

      - name: Test
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: npm run test:ci test/server/graphql

      - name: Test with coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run test:coverage test/server/graphql

      - name: Report coverage
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: GraphQL

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results.xml
          report_type: test_results

  schema-update:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30

    services:
      redis:
        image: valkey/valkey:9.1
        ports:
          - 6379:6379
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Generate & check schemas
        run: ./scripts/check-schemas.sh

  # Cost of the frontend operations against the schema of this branch (opencollective/opencollective#9084): reports
  # the operations that a change of weight, list size or formula pushes over the maximum or close to it, and the
  # cost changes compared to the base branch. Report only until the maximum is calibrated
  # (opencollective/opencollective#9086).
  graphql-cost:
    name: GraphQL query cost
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Get Node major version
        id: node-major
        run: echo "version=$(node -p 'process.versions.node.split(`.`)[0]')" >> "$GITHUB_OUTPUT"

      # Same frontend revision as the E2E workflow: the branch with the same name, otherwise main
      - name: Checkout frontend
        id: checkout-stack
        uses: ./.github/actions/checkout-e2e-stack
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore node_modules (frontend)
        uses: actions/cache@v6
        id: frontend-node-modules
        with:
          path: opencollective-frontend/node_modules
          key: ${{ runner.os }}-node${{ steps.node-major.outputs.version }}-frontend-node-modules-${{ hashFiles('opencollective-frontend/package-lock.json') }}

      - name: Install dependencies (frontend)
        if: steps.frontend-node-modules.outputs.cache-hit != 'true'
        working-directory: opencollective-frontend
        env:
          npm_config_engine_strict: 'false'
        run: CYPRESS_INSTALL_BINARY=0 npm ci --prefer-offline --no-audit --no-fund

      - name: Checkout base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: api-base
          persist-credentials: false

      - name: Report
        env:
          FRONTEND_REF: ${{ steps.checkout-stack.outputs.frontend-ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/graphql-cost"
          mkdir -p "${out}"
          if [ ! -f opencollective-frontend/scripts/extract-graphql-operations.ts ]; then
            message="The frontend revision ${FRONTEND_REF} cannot extract its operations yet (scripts/extract-graphql-operations.ts), skipping the report."
            echo "::notice title=GraphQL query cost::${message}"
            echo "${message}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          (cd opencollective-frontend && npx tsx scripts/extract-graphql-operations.ts "${out}/operations")
          args=("${out}/operations" --variables "${out}/operations/variables.json")

          # Baseline: the same operations against the schema of the base branch, if it has the command
          baseline=()
          compared_to="not computed"
          if [ -f api-base/scripts/graphql-cost.ts ]; then
            if cmp -s package-lock.json api-base/package-lock.json; then
              ln -s "${PWD}/node_modules" api-base/node_modules
            else
              (cd api-base && npm ci --prefer-offline --no-audit --no-fund)
            fi
            if (cd api-base && npm run graphql:cost -- "${args[@]}" --json "${out}/base.json" --markdown /dev/null); then
              baseline=(--baseline "${out}/base.json")
              compared_to="compared to the schema of ${BASE_REF}"
            else
              echo "::warning title=GraphQL query cost::Could not compute the cost against ${BASE_REF}, the report does not compare costs"
            fi
          else
            echo "::notice title=GraphQL query cost::${BASE_REF} does not have the cost command yet, the report does not compare costs"
          fi

          npm run graphql:cost -- "${args[@]}" "${baseline[@]}" \
            --heading "GraphQL query cost of the frontend operations" \
            --json "${out}/report.json" --markdown "${out}/report.md"
          {
            cat "${out}/report.md"
            echo ""
            echo "Frontend revision: opencollective/opencollective-frontend@${FRONTEND_REF}. Cost changes: ${compared_to}."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: graphql-cost
          path: ${{ runner.temp }}/graphql-cost/*.json
          if-no-files-found: ignore
          retention-days: 14

  graphql-inspector:
    name: GraphQL Inspector
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    # The action publishes its results as check runs (with annotations) and reads PR labels for the
    # approve-label override. Workflows triggered by Dependabot get a read-only GITHUB_TOKEN by
    # default, so the write scope must be requested explicitly. This job never installs or runs
    # code from the PR (it only diffs the committed schema files), so the token is only ever
    # handled by the SHA-pinned action below.
    #
    # The action creates its check run and updates it within the same second, and that update
    # sometimes returns a 404 from the GitHub API. The action then marks the run as
    # "Invalid config. Failed to add annotation" and fails the step. The results are only
    # informational (`fail-on-breaking: false`), so a failing step must not fail CI or skip the
    # V2 comparison.
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: GraphQL Inspector (V1)
        continue-on-error: true
        uses: graphql-hive/graphql-inspector@c0ecb19ad21de709b80ed897041a4976c079c718 # v4.0.0
        with:
          name: 'GraphQL Inspector - Schema v1'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          schema: 'main:server/graphql/schemaV1.graphql'
          fail-on-breaking: false

      - name: GraphQL Inspector (V2)
        continue-on-error: true
        uses: graphql-hive/graphql-inspector@c0ecb19ad21de709b80ed897041a4976c079c718 # v4.0.0
        with:
          name: 'GraphQL Inspector - Schema v2'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          schema: 'main:server/graphql/schemaV2.graphql'
          fail-on-breaking: false
