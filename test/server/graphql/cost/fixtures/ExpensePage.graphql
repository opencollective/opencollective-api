# Copied from the `ExpensePage` query of opencollective-frontend (components/expenses/graphql/queries.ts), with its
# fragments, to measure the analyzer on the largest real frontend query.
# eslint-disable @graphql-eslint/no-deprecated
query ExpensePage(
  $legacyExpenseId: Int!
  $draftKey: String
  $offset: Int
  $totalPaidExpensesDateFrom: DateTime
  $hostSlug: String
  $includeFiscalHostNote: Boolean! = false
) {
  expense(expense: { legacyId: $legacyExpenseId }, draftKey: $draftKey) {
    id
    ...ExpensePageExpenseFields
    account {
      fiscalHostNote(host: { slug: $hostSlug }) @include(if: $includeFiscalHostNote) {
        type
        note
        updatedAt
        updatedBy {
          id
          name
          slug
        }
      }
    }
    createdByAccount {
      fiscalHostNote(host: { slug: $hostSlug }) @include(if: $includeFiscalHostNote) {
        type
        note
        updatedAt
        updatedBy {
          id
          name
          slug
        }
      }
    }
    payee {
      id
      ...ExpensePayeeFields
      fiscalHostNote(host: { slug: $hostSlug }) @include(if: $includeFiscalHostNote) {
        type
        note
        updatedAt
        updatedBy {
          id
          name
          slug
        }
      }
      stats {
        id
        totalPaidExpenses(dateFrom: $totalPaidExpensesDateFrom) {
          valueInCents
          currency
        }
        totalPaidInvoices: totalPaidExpenses(expenseType: [INVOICE], dateFrom: $totalPaidExpensesDateFrom) {
          valueInCents
          currency
        }
        totalPaidReceipts: totalPaidExpenses(expenseType: [RECEIPT], dateFrom: $totalPaidExpensesDateFrom) {
          valueInCents
          currency
        }
        totalPaidGrants: totalPaidExpenses(expenseType: [GRANT], dateFrom: $totalPaidExpensesDateFrom) {
          valueInCents
          currency
        }
      }
    }
    permissions {
      canDeclineExpenseInvite(draftKey: $draftKey)
    }
    comments(limit: 100, offset: $offset) {
      totalCount
      nodes {
        id
        ...CommentFields
      }
    }
  }
  loggedInAccount {
    id
    ...LoggedInAccountExpensePayoutFields
  }
}

fragment AccountingCategorySelectFields on AccountingCategory {
  id
  kind
  code
  hostOnly
  instructions
  name
  friendlyName
  expensesTypes
  createdAt
  appliesTo
}

fragment ExpenseValuesByRole on ExpenseValuesByRole {
  id
  submitter {
    accountingCategory {
      ...AccountingCategorySelectFields
    }
  }
  accountAdmin {
    accountingCategory {
      ...AccountingCategorySelectFields
    }
  }
  hostAdmin {
    accountingCategory {
      ...AccountingCategorySelectFields
    }
  }
}

fragment AccountHoverCardFields on Account {
  id
  publicId
  name
  legalName
  slug
  type
  description
  imageUrl
  isHost
  isArchived
  isVerified
  hasPublicProfile
  ... on Individual {
    id
    isGuest
  }
  ... on AccountWithHost {
    host {
      id
      slug
      type
      isTrustedHost
      isFirstPartyHost
      isVerified
      hasPublicProfile
    }
    approvedAt
  }
  ... on Organization {
    host {
      id
      slug
      type
      isTrustedHost
      isFirstPartyHost
      isVerified
      hasPublicProfile
    }
  }
  ... on AccountWithParent {
    parent {
      id
      slug
      hasPublicProfile
    }
  }
}

fragment ExpensePayeeFields on Account {
  id
  slug
  name
  legalName
  imageUrl
  type
  isAdmin
  isActive
  description
  ...AccountHoverCardFields
  location {
    id
    address
    country
  }
  payoutMethods {
    id
    type
    name
    data
    isSaved
  }
  ... on AccountWithHost {
    isApproved
    host {
      id
      slug
      payoutMethods {
        id
        type
        name
        data
        isSaved
      }
    }
  }
  ... on Organization {
    host {
      id
      slug
    }
  }
}

fragment ExpenseHostFields on Host {
  id
  legacyId
  name
  legalName
  slug
  type
  currency
  isHost
  expensePolicy
  website
  settings
  features {
    id
    MULTI_CURRENCY_EXPENSES
    PAYPAL_PAYOUTS
    CHART_OF_ACCOUNTS
    TRANSFERWISE
  }
  location {
    id
    address
    country
  }
  transferwise {
    id
    availableCurrencies
  }
  supportedPayoutMethods
  isTrustedHost
  plan {
    id
  }
  expenseAccountingCategories: accountingCategories(kind: EXPENSE) {
    nodes {
      id
      ...AccountingCategorySelectFields
    }
  }
  policies {
    id
    EXPENSE_CATEGORIZATION {
      requiredForExpenseSubmitters
      requiredForCollectiveAdmins
    }
  }
  ... on AccountWithPlatformSubscription {
    platformSubscription {
      plan {
        title
      }
    }
  }
}

fragment NavbarFields on CollectiveFeatures {
  id
  ABOUT
  CONNECTED_ACCOUNTS
  RECEIVE_FINANCIAL_CONTRIBUTIONS
  RECURRING_CONTRIBUTIONS
  EVENTS
  PROJECTS
  USE_EXPENSES
  RECEIVE_EXPENSES
  RECEIVE_GRANTS
  COLLECTIVE_GOALS
  TOP_FINANCIAL_CONTRIBUTORS
  CONVERSATIONS
  UPDATES
  TEAM
  CONTACT_FORM
  RECEIVE_HOST_APPLICATIONS
  HOST_DASHBOARD
  TRANSACTIONS
  REQUEST_VIRTUAL_CARDS
  PUBLIC_PROFILE
}

fragment ExpensePageExpenseFields on Expense {
  id
  legacyId
  publicId
  description
  longDescription
  currency
  type
  status
  onHold
  privateMessage
  reference
  tags
  amount
  accountingCategory {
    id
    ...AccountingCategorySelectFields
  }
  balanceAccountingCategory {
    id
    code
    name
    friendlyName
  }
  valuesByRole {
    id
    ...ExpenseValuesByRole
  }
  amountInAccountCurrency: amountV2(currencySource: ACCOUNT) {
    valueInCents
    currency
    exchangeRate {
      date
      value
      source
      isApproximate
      fromCurrency
      toCurrency
    }
  }
  amountInHostCurrency: amountV2(currencySource: HOST) {
    valueInCents
    currency
    exchangeRate {
      date
      value
      source
      isApproximate
      fromCurrency
      toCurrency
    }
  }
  createdAt
  invoiceInfo
  merchantId
  requiredLegalDocuments
  receivedTaxForms: legalDocuments(type: US_TAX_FORM, status: RECEIVED) {
    nodes {
      id
      type
      documentLink
      year
    }
  }
  feesPayer
  draft
  items {
    id
    incurredAt
    description
    amount
    amountV2 {
      valueInCents
      currency
      exchangeRate {
        date
        value
        source
        fromCurrency
        toCurrency
      }
    }
    referenceExchangeRate {
      value
      fromCurrency
      toCurrency
    }
    url
    file {
      id
      type
      ... on ImageFileInfo {
        width
      }
    }
  }
  taxes {
    id
    type
    rate
    idNumber
  }
  invoiceFile {
    id
    url
    name
    type
    size
    ... on ImageFileInfo {
      width
    }
  }
  attachedFiles {
    id
    url
    name
    info {
      id
      type
      name
      size
      ... on ImageFileInfo {
        width
      }
    }
  }
  payee {
    id
    ...ExpensePayeeFields
  }
  payeeLocation {
    id
    address
    country
    structured
  }
  createdByAccount {
    id
    slug
    name
    type
    imageUrl
    legacyId
    ...AccountHoverCardFields
  }
  host {
    id
    ...ExpenseHostFields
  }
  requestedByAccount {
    id
    slug
    name
    type
    imageUrl
    ...AccountHoverCardFields
  }
  approvedBy {
    id
    type
    slug
    name
    imageUrl
    ...AccountHoverCardFields
  }
  account {
    id
    legacyId
    slug
    name
    type
    imageUrl
    backgroundImageUrl
    isActive
    description
    settings
    twitterHandle
    currency
    expensePolicy
    supportedExpenseTypes
    features {
      id
      ...NavbarFields
      MULTI_CURRENCY_EXPENSES
      TAX_FORMS
    }
    location {
      id
      address
      country
    }
    stats {
      id
      balance {
        valueInCents
        currency
      }
      balanceWithBlockedFunds: balance(withBlockedFunds: true) {
        valueInCents
        currency
      }
    }
    ... on AccountWithParent {
      parent {
        id
        slug
        imageUrl
        backgroundImageUrl
        twitterHandle
      }
    }
    ... on AccountWithHost {
      isApproved
      hostAgreements {
        totalCount
      }
      host {
        id
        slug
        legacyId
        ...ExpenseHostFields
        transferwise {
          id
          availableCurrencies
        }
      }
    }
    ... on Organization {
      isHost
      isActive
      host {
        id
        ...ExpenseHostFields
        transferwise {
          id
          availableCurrencies
        }
      }
    }
    ... on Event {
      parent {
        id
        slug
        name
        type
        imageUrl
      }
    }
    ... on Project {
      parent {
        id
        slug
        name
        type
        imageUrl
      }
    }
    ...AccountHoverCardFields
  }
  payoutMethod {
    id
    type
    name
    data
    isSaved
    canBeEdited
    canBeDeleted
    isVerified
  }
  virtualCard {
    id
    name
    last4
  }
  permissions {
    id
    canEdit
    canEditTags
    canEditAccountingCategory
    editAccountingCategory {
      allowed
      reason
    }
    canEditType
    canEditTitle
    canEditItems
    canEditPaidBy
    canEditPayee
    canEditPayoutMethod
    canAttachReceipts
    canDelete
    canSeeInvoiceInfo
    canApprove
    canUnapprove
    canReject
    canMarkAsSpam
    canPay
    canMarkAsPaid
    canMarkAsUnpaid
    canMarkAsIncomplete
    canComment
    canUnschedulePayment
    canVerifyDraftExpense
    canUsePrivateNote
    canHold
    canRelease
    canDownloadTaxForm
    canSeePayoutMethodPrivateDetails
    approve {
      allowed
      reason
      reasonDetails
    }
  }
  lockedFields
  activities {
    id
    type
    createdAt
    data
    account {
      id
      slug
      ... on AccountWithHost {
        host {
          id
          slug
        }
      }
    }
    individual {
      id
      type
      slug
      name
      imageUrl
      ...AccountHoverCardFields
    }
    transaction {
      id
      kind
      type
      amount {
        valueInCents
        currency
      }
      platformFee {
        valueInCents
        currency
      }
      hostFee {
        valueInCents
        currency
      }
      paymentProcessorFee {
        valueInCents
        currency
      }
      netAmount {
        valueInCents
        currency
      }
      taxAmount(fetchTax: true) {
        valueInCents
        currency
      }
      taxInfo {
        id
        rate
        type
        percentage
      }
      fromAccount {
        id
        slug
        name
        ... on AccountWithHost {
          hostFeePercent
        }
      }
      toAccount {
        id
        slug
        name
        ... on AccountWithHost {
          hostFeePercent
        }
      }
      expense {
        id
        currency
        amount
        feesPayer
      }
      relatedTransactions(kind: [PAYMENT_PROCESSOR_FEE, EXPENSE]) {
        id
        type
        kind
        amount {
          valueInCents
          currency
        }
        netAmountInPayeeCurrency {
          valueInCents
          currency
        }
        netAmount {
          valueInCents
          currency
        }
      }
    }
  }
  recurringExpense {
    id
    interval
    endsAt
  }
  securityChecks {
    level
    message
    scope
    details
  }
  kycStatus {
    payee {
      status
    }
  }
}

fragment CommentFields on Comment {
  id
  createdAt
  html
  reactions
  userReactions
  type
  account {
    id
    slug
    type
    ... on AccountWithHost {
      host {
        id
        slug
      }
    }
  }
  fromAccount {
    id
    type
    name
    slug
    imageUrl
    ...AccountHoverCardFields
  }
}

fragment LoggedInAccountExpensePayoutFields on Individual {
  id
  slug
  imageUrl
  type
  name
  legalName
  isUSEntity
  hasTwoFactorAuth
  location {
    id
    address
    country
    structured
  }
  payoutMethods {
    id
    type
    name
    data
    isSaved
    canBeEdited
    canBeDeleted
    createdAt
    updatedAt
    isVerified
  }
  adminMemberships: memberOf(role: ADMIN, includeIncognito: false, accountType: [ORGANIZATION, COLLECTIVE, FUND]) {
    nodes {
      id
      account {
        id
        legacyId
        slug
        imageUrl
        type
        name
        legalName
        isUSEntity
        isActive
        isHost
        policies {
          id
          REQUIRE_2FA_FOR_ADMINS
        }
        ... on AccountWithParent {
          parent {
            id
            legacyId
            slug
            policies {
              id
              REQUIRE_2FA_FOR_ADMINS
            }
          }
        }
        ... on AccountWithHost {
          host {
            id
            payoutMethods {
              id
              type
              name
              data
              isSaved
            }
          }
        }
        ... on Organization {
          host {
            id
            payoutMethods {
              id
              type
              name
              data
              isSaved
            }
          }
        }
        location {
          id
          address
          country
          structured
        }
        payoutMethods {
          id
          type
          name
          data
          isSaved
        }
        childrenAccounts {
          nodes {
            id
            slug
            imageUrl
            type
            name
            isActive
          }
        }
      }
    }
  }
}
